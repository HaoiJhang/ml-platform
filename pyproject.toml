[project]
name = "ml-platform"
version = "0.1.0"
description = "Local research prototype for EDA, data cleaning, model training, evaluation, and LLM-assisted reporting."
readme = "README.md"
requires-python = ">=3.9,<3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
