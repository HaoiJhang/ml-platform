[project]
name = "ml-platform"
version = "0.1.0"
description = "Local research prototype for EDA, data cleaning, model training, evaluation, and LLM-assisted reporting."
readme = "README.md"
requires-python = ">=3.9,<3.12"
dependencies = [
    "flaml[automl]>=2.3.0",
    "joblib>=1.4.2",
    "numpy>=2.0.2",
    "openai>=2.0.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.5.2",
    "streamlit>=1.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
